<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1700 960" role="img" aria-label="ThoughtNode vault sync architecture: the master machine runs Obsidian, a GitHub client, a local vault and a local Obsidian MCP server; the vault version-controls to GitHub Cloud and sync-replicates through Obsidian Cloud to the mobile and laptop vaults." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="glowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2E9E" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#FF2E9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#23F0E2" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#23F0E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6EC7"/>
      <stop offset="48%" stop-color="#C86AE0"/>
      <stop offset="100%" stop-color="#23F0E2"/>
    </linearGradient>

    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0v46" fill="none" stroke="#FFFFFF" stroke-opacity=".028" stroke-width="1"/>
    </pattern>

    <marker id="amEnd" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 4.5 0 9Z" fill="#FF6EC7"/>
    </marker>
    <marker id="amStart" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11 0 1 4.5 11 9Z" fill="#FF6EC7"/>
    </marker>
    <marker id="acEnd" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 10 4.5 0 9Z" fill="#5BF3E8"/>
    </marker>
    <marker id="acStart" markerWidth="11" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M11 0 1 4.5 11 9Z" fill="#5BF3E8"/>
    </marker>

    <g id="icChip" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4.5" y="4.5" width="15" height="15" rx="2.5"/>
      <rect x="9" y="9" width="6" height="6" rx="1"/>
      <path d="M8.5 4.5v-3M12 4.5v-3M15.5 4.5v-3M8.5 19.5v3M12 19.5v3M15.5 19.5v3M4.5 8.5h-3M4.5 12h-3M4.5 15.5h-3M19.5 8.5h3M19.5 12h3M19.5 15.5h3"/>
    </g>
    <g id="icNote" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2.2H6.4a2.2 2.2 0 0 0-2.2 2.2v15.2a2.2 2.2 0 0 0 2.2 2.2h11.2a2.2 2.2 0 0 0 2.2-2.2V8.2Z"/>
      <path d="M14 2.2v6h5.8"/>
      <circle cx="9" cy="12.4" r="1.7"/><circle cx="15" cy="15" r="1.7"/><circle cx="9.6" cy="18.4" r="1.7"/>
      <path d="M10.5 13.1 13.5 14.4M9.2 14.1 9.4 16.7"/>
    </g>
    <g id="icGit" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="6.5" cy="5" r="2.6"/><circle cx="6.5" cy="19" r="2.6"/><circle cx="17.5" cy="8.5" r="2.6"/>
      <path d="M6.5 7.6v8.8"/>
      <path d="M17.5 11.1c0 3.4-11 2.1-11 5.3"/>
    </g>
    <g id="icFolder" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.8 20.4a2 2 0 0 0 2-2V8.6a2 2 0 0 0-2-2h-7.3a2 2 0 0 1-1.66-.89L9.8 4.5a2 2 0 0 0-1.66-.89H4.2a2 2 0 0 0-2 2v12.8a2 2 0 0 0 2 2Z"/>
      <path d="M2.2 11.2h19.6"/>
    </g>
    <g id="icCloud" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.4 18.6H8.8a6.6 6.6 0 1 1 6.3-8.5h1.7a4.25 4.25 0 1 1 .6 8.5Z"/>
    </g>
    <g id="icPhone" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5.6" y="2.2" width="12.8" height="19.6" rx="2.4"/>
      <path d="M10.2 5.2h3.6"/>
      <circle cx="12" cy="18.4" r=".9"/>
    </g>
    <g id="icLaptop" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.8" y="4.2" width="16.4" height="11.2" rx="1.8"/>
      <path d="M1.6 18.9h20.8"/>
      <path d="M3.8 15.4 1.6 18.9M20.2 15.4 22.4 18.9"/>
    </g>
    <g id="icTower" transform="translate(-12,-12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="2.4" width="12" height="19.2" rx="2.2"/>
      <path d="M9.4 6.2h5.2M9.4 9h5.2"/>
      <circle cx="12" cy="15.2" r="2.6"/>
      <path d="M12 12.6v-1.2M12 17.8v1.2M9.4 15.2H8.2M14.6 15.2h1.2"/>
    </g>
  </defs>

  <rect width="1700" height="960" fill="#05060B"/>
  <rect width="1700" height="960" fill="url(#grid)"/>
  <ellipse cx="330" cy="700" rx="600" ry="360" fill="url(#glowM)" opacity=".85"/>
  <ellipse cx="1430" cy="330" rx="560" ry="400" fill="url(#glowC)"/>
  <ellipse cx="880" cy="500" rx="520" ry="380" fill="url(#glowM)" opacity=".5"/>

  <!-- wordmark -->
  <g filter="url(#neonSoft)">
    <text x="1662" y="82" text-anchor="end" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="400" letter-spacing="1.5"
          fill="none" stroke="url(#wordGrad)" stroke-width="1.1">ThoughtNode</text>
  </g>
  <text x="1660" y="112" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12.5" letter-spacing="4.2" fill="#7E86A2">VAULT SYNC ARCHITECTURE</text>

  <!-- ============ PANELS ============ -->
  <g fill="none" stroke-width="1.2" stroke-dasharray="7 5" opacity=".8">
    <rect x="340" y="210" width="690" height="520" rx="20" stroke="#FF2E9E" filter="url(#neonSoft)"/>
    <rect x="40" y="500" width="260" height="240" rx="18" stroke="#23F0E2" filter="url(#neonSoft)"/>
    <rect x="1070" y="500" width="260" height="240" rx="18" stroke="#23F0E2" filter="url(#neonSoft)"/>
    <rect x="1390" y="150" width="280" height="350" rx="18" stroke="#23F0E2" filter="url(#neonSoft)"/>
    <rect x="1390" y="570" width="280" height="350" rx="18" stroke="#23F0E2" filter="url(#neonSoft)"/>
  </g>
  <g fill="rgba(255,46,158,.030)"><rect x="340" y="210" width="690" height="520" rx="20"/></g>
  <g fill="rgba(35,240,226,.028)">
    <rect x="40" y="500" width="260" height="240" rx="18"/>
    <rect x="1070" y="500" width="260" height="240" rx="18"/>
    <rect x="1390" y="150" width="280" height="350" rx="18"/>
    <rect x="1390" y="570" width="280" height="350" rx="18"/>
  </g>

  <!-- panel headers -->
  <g stroke-width="1.3" filter="url(#neon)">
    <use href="#icTower" x="372" y="248" fill="none" stroke="#FF8AD0"/>
    <use href="#icPhone" x="1422" y="188" fill="none" stroke="#7FFFF3"/>
    <use href="#icLaptop" x="1422" y="608" fill="none" stroke="#7FFFF3"/>
  </g>
  <g font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="2.6">
    <text x="394" y="253" fill="#FF9BD6">THOUGHTNODE MASTER</text>
    <text x="1444" y="193" fill="#8FF6EC">ANDROID / iOS MOBILE</text>
    <text x="1444" y="613" fill="#8FF6EC">LAPTOP</text>
    <text x="68" y="543" fill="#8FF6EC">CLOUD STORAGE</text>
    <text x="1098" y="543" fill="#8FF6EC">CLOUD STORAGE</text>
  </g>

  <!-- ============ EDGES ============ -->
  <g fill="none" stroke-width="1.6" filter="url(#neon)">
    <!-- master internal (magenta) -->
    <path d="M760 345H609" stroke="#FF6EC7" marker-end="url(#amEnd)"/>
    <path d="M875 391V575" stroke="#FF6EC7" marker-end="url(#amEnd)"/>
    <path d="M609 625H756" stroke="#FF6EC7" marker-end="url(#amEnd)" marker-start="url(#amStart)"/>
    <!-- cloud sync (cyan) -->
    <path d="M284 625H371" stroke="#5BF3E8" marker-end="url(#acEnd)" marker-start="url(#acStart)"/>
    <path d="M994 625H1086" stroke="#5BF3E8" marker-end="url(#acEnd)" marker-start="url(#acStart)"/>
    <path d="M1314 605h26q20 0 20-20V435q0-20 20-20h31" stroke="#5BF3E8" marker-end="url(#acEnd)" marker-start="url(#acStart)"/>
    <path d="M1314 645h26q20 0 20 20V815q0 20 20 20h31" stroke="#5BF3E8" marker-end="url(#acEnd)" marker-start="url(#acStart)"/>
    <!-- device internal (cyan) -->
    <path d="M1530 321V365" stroke="#5BF3E8" marker-end="url(#acEnd)"/>
    <path d="M1530 741V785" stroke="#5BF3E8" marker-end="url(#acEnd)"/>
  </g>
  <!-- fiber nodes -->
  <g filter="url(#neon)">
    <circle cx="1360" cy="500" r="3.4" fill="#7FFFF3"/>
    <circle cx="1360" cy="740" r="3.4" fill="#7FFFF3"/>
    <circle cx="682" cy="625" r="3.4" fill="#FF8AD0"/>
    <circle cx="1040" cy="625" r="3.4" fill="#7FFFF3"/>
    <circle cx="327" cy="625" r="3.4" fill="#7FFFF3"/>
  </g>

  <!-- edge labels -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing="1.1">
    <text x="684" y="331" text-anchor="middle" fill="#FFA8DB">Agent interaction</text>
    <text x="890" y="487" fill="#FFA8DB">Data storage</text>
    <text x="682" y="609" text-anchor="middle" fill="#FFA8DB">Version control</text>
    <text x="327" y="609" text-anchor="middle" fill="#8FF6EC">Sync</text>
    <text x="1040" y="609" text-anchor="middle" fill="#8FF6EC">Sync</text>
    <text x="1374" y="524" fill="#8FF6EC">Sync</text>
    <text x="1374" y="700" fill="#8FF6EC">Sync</text>
  </g>

  <!-- ============ NODES ============ -->
  <!-- Master: Obsidian MCP Server -->
  <g>
    <rect x="375" y="299" width="230" height="92" rx="14" fill="rgba(10,6,16,.72)" stroke="#FF2E9E" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icChip" x="415" y="345" fill="none" stroke="#FF8AD0" stroke-width="1.3" filter="url(#neon)"/>
    <text x="447" y="341" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="500" fill="#F4E9F5">Obsidian MCP Server</text>
    <text x="447" y="361" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#A886AF">Local API</text>
  </g>
  <!-- Master: Obsidian App -->
  <g>
    <rect x="760" y="299" width="230" height="92" rx="14" fill="rgba(10,6,16,.72)" stroke="#FF2E9E" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icNote" x="800" y="345" fill="none" stroke="#FF8AD0" stroke-width="1.3" filter="url(#neon)"/>
    <text x="832" y="341" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#F4E9F5">Obsidian App</text>
    <text x="832" y="361" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#A886AF">Master</text>
  </g>
  <!-- Master: GitHub App -->
  <g>
    <rect x="375" y="579" width="230" height="92" rx="14" fill="rgba(10,6,16,.72)" stroke="#FF2E9E" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icGit" x="415" y="625" fill="none" stroke="#FF8AD0" stroke-width="1.3" filter="url(#neon)"/>
    <text x="447" y="621" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#F4E9F5">GitHub App</text>
    <text x="447" y="641" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#A886AF">Version control</text>
  </g>
  <!-- Master: Local Vault -->
  <g>
    <rect x="760" y="579" width="230" height="92" rx="14" fill="rgba(10,6,16,.72)" stroke="#FF2E9E" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icFolder" x="800" y="625" fill="none" stroke="#FF8AD0" stroke-width="1.3" filter="url(#neon)"/>
    <text x="832" y="621" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#F4E9F5">Local directory</text>
    <text x="832" y="641" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#A886AF">Vault</text>
  </g>
  <!-- GitHub Cloud -->
  <g>
    <rect x="55" y="579" width="230" height="92" rx="14" fill="rgba(4,14,17,.72)" stroke="#23F0E2" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icCloud" x="95" y="625" fill="none" stroke="#7FFFF3" stroke-width="1.3" filter="url(#neon)"/>
    <text x="127" y="621" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#E4F8F7">GitHub Cloud</text>
    <text x="127" y="641" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#79A8AC">Repository</text>
  </g>
  <!-- Obsidian Cloud -->
  <g>
    <rect x="1085" y="579" width="230" height="92" rx="14" fill="rgba(4,14,17,.72)" stroke="#23F0E2" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icCloud" x="1125" y="625" fill="none" stroke="#7FFFF3" stroke-width="1.3" filter="url(#neon)"/>
    <text x="1157" y="621" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#E4F8F7">Obsidian Cloud</text>
    <text x="1157" y="641" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#79A8AC">Sync service</text>
  </g>
  <!-- Mobile nodes -->
  <g>
    <rect x="1415" y="229" width="230" height="92" rx="14" fill="rgba(4,14,17,.72)" stroke="#23F0E2" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icNote" x="1455" y="275" fill="none" stroke="#7FFFF3" stroke-width="1.3" filter="url(#neon)"/>
    <text x="1487" y="281" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#E4F8F7">Obsidian App</text>
  </g>
  <g>
    <rect x="1415" y="369" width="230" height="92" rx="14" fill="rgba(4,14,17,.72)" stroke="#23F0E2" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icFolder" x="1455" y="415" fill="none" stroke="#7FFFF3" stroke-width="1.3" filter="url(#neon)"/>
    <text x="1487" y="411" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#E4F8F7">Local directory</text>
    <text x="1487" y="431" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#79A8AC">Vault</text>
  </g>
  <!-- Laptop nodes -->
  <g>
    <rect x="1415" y="649" width="230" height="92" rx="14" fill="rgba(4,14,17,.72)" stroke="#23F0E2" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icNote" x="1455" y="695" fill="none" stroke="#7FFFF3" stroke-width="1.3" filter="url(#neon)"/>
    <text x="1487" y="701" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#E4F8F7">Obsidian App</text>
  </g>
  <g>
    <rect x="1415" y="789" width="230" height="92" rx="14" fill="rgba(4,14,17,.72)" stroke="#23F0E2" stroke-width="1.4" filter="url(#neon)"/>
    <use href="#icFolder" x="1455" y="835" fill="none" stroke="#7FFFF3" stroke-width="1.3" filter="url(#neon)"/>
    <text x="1487" y="831" font-family="Chakra Petch, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="500" fill="#E4F8F7">Local directory</text>
    <text x="1487" y="851" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" letter-spacing=".8" fill="#79A8AC">Vault</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-family="IBM Plex Mono, ui-monospace, monospace">
    <text x="60" y="808" font-size="11" letter-spacing="3.4" fill="#6E7590">LEGEND</text>
    <g fill="none" stroke-width="7" stroke-opacity=".22" stroke-linecap="round">
      <path d="M62 856h40" stroke="#FF2E9E"/>
      <path d="M402 856h40" stroke="#23F0E2"/>
      <path d="M746 856h34" stroke="#23F0E2"/>
    </g>
    <g stroke-width="1.6" fill="none">
      <path d="M60 856h46" stroke="#FF6EC7" marker-end="url(#amEnd)"/>
      <path d="M400 856h46" stroke="#5BF3E8" marker-end="url(#acEnd)"/>
      <path d="M744 856h38" stroke="#5BF3E8" marker-end="url(#acEnd)" marker-start="url(#acStart)"/>
    </g>
    <g font-size="12.5" fill="#8C93AD">
      <text x="122" y="861">Local, on the machine</text>
      <text x="462" y="861">Cloud transfer</text>
      <text x="806" y="861">Two-way sync</text>
    </g>
  </g>
</svg>